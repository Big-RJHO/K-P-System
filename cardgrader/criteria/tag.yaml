# TAG Grading criteria (theoretical model).
# TAG scores a card from 100 to 1000 using computer vision, then maps the score to a grade.
# In this file, grade 10.5 stands for the "Pristine 10" label (990-1000) and 10 for "Gem Mint 10" (950-989).
# Centering uses TAG's published TCG (Pokémon) tolerances. Each "score" value is the
# centering sub-score at exactly that tolerance, and values in between are interpolated linearly.
company: TAG
last_verified: "2026-09-27"
sources:
  - https://taggrading.com/pages/scale
  - https://taggrading.com/pages/rubric
bands:            # [min score, grade, label]
  - [990, 10.5, Pristine 10]
  - [950, 10, Gem Mint 10]
  - [900, 9, Mint 9]
  - [850, 8.5, NM MT+ 8.5]
  - [800, 8, NM MT 8]
  - [750, 7.5, NM+ 7.5]
  - [700, 7, NM 7]
  - [650, 6.5, EX MT+ 6.5]
  - [600, 6, EX MT 6]
  - [550, 5.5, EX+ 5.5]
  - [500, 5, EX 5]
  - [450, 4.5, VG EX+ 4.5]
  - [400, 4, VG EX 4]
  - [350, 3.5, VG+ 3.5]
  - [300, 3, VG 3]
  - [250, 2.5, Good+ 2.5]
  - [200, 2, Good 2]
  - [150, 1.5, Fair 1.5]
  - [100, 1, Poor 1]
tolerance: 0.5
centering:
  # grade -> front limit (worse axis) and TCG back limit, from TAG's rubric
  - {grade: 10.5, front: 51,   back: 52}
  - {grade: 10,   front: 55,   back: 65}
  - {grade: 9,    front: 60,   back: 75}
  - {grade: 8.5,  front: 62.5, back: 85}
  - {grade: 8,    front: 65,   back: 95}
  - {grade: 7.5,  front: 67.5, back: 97.5}
  - {grade: 7,    front: 70,   back: 97.5}
  - {grade: 6,    front: 75,   back: 99}    # interp below 7
  - {grade: 5,    front: 80,   back: 99}
  - {grade: 4,    front: 85,   back: 100}
  - {grade: 3,    front: 90,   back: 100}
  - {grade: 1,    front: 100,  back: 100}
centering_points:   # [share %, sub-score] used to interpolate the centering sub-score
  front: [[50, 1000], [51, 990], [55, 950], [60, 900], [62.5, 850], [65, 800], [67.5, 750], [70, 700], [75, 600], [80, 500], [85, 400], [90, 300], [95, 200], [100, 100]]
  back:  [[50, 1000], [52, 990], [65, 950], [75, 900], [85, 850], [95, 800], [97.5, 700], [99, 600], [100, 400]]
# How the eight area sub-scores (front/back x centering/corners/edges/surface) combine:
# score = weakest_weight * lowest area + (1 - weakest_weight) * weighted mean of all areas
weakest_weight: 0.85
side_weights: {front: 0.6, back: 0.4}
# Sub-score for a component at a given condition grade (10.5 = flawless).
condition_points: {10.5: 1000, 10: 965, 9.5: 940, 9: 915, 8.5: 870, 8: 820, 7.5: 770, 7: 720, 6.5: 670, 6: 620, 5.5: 570, 5: 520, 4.5: 470, 4: 420, 3.5: 370, 3: 320, 2.5: 270, 2: 220, 1.5: 170, 1: 120}
