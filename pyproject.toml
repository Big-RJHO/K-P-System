[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardgrader"
version = "0.1.0"
description = "In-house Pokémon/TCG card pre-grader that predicts PSA, BGS, CGC and TAG grades"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cardgrader = "cardgrader.web.__main__:main"

[tool.setuptools.packages.find]
include = ["cardgrader*"]

[tool.setuptools.package-data]
cardgrader = ["criteria/*.yaml", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
